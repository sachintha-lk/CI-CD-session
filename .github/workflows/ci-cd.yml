name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  REGISTRY: registry.digitalocean.com/my-registry # Replace with your registry name
  IMAGE_NAME: spring-boot-demo

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo 
        uses: actions/checkout@v3

      - name: Build container image
        run: docker build -t $(echo $REGISTRY)/$(echo $IMAGE_NAME):$(echo $GITHUB_SHA | head -c7) .

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 600

      - name: Push image to DigitalOcean Container Registry
        run: docker push $(echo $REGISTRY)/$(echo $IMAGE_NAME):$(echo $GITHUB_SHA | head -c7)

      # Optional: Update App Platform to use the new image
      # - name: Update App Platform
      #   run: doctl apps update <APP_ID> --spec .do/app.yaml

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  REGISTRY: registry.digitalocean.com/demo-cicd-12ds3df # Replace with your registry name
  IMAGE_NAME: spring-boot-demo

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo 
        uses: actions/checkout@v3

      - name: Build container image
        run: |
          docker build -t $(echo $REGISTRY)/$(echo $IMAGE_NAME):$(echo $GITHUB_SHA | head -c7) \
                       -t $(echo $REGISTRY)/$(echo $IMAGE_NAME):latest .

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 600

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push $(echo $REGISTRY)/$(echo $IMAGE_NAME):$(echo $GITHUB_SHA | head -c7)
          docker push $(echo $REGISTRY)/$(echo $IMAGE_NAME):latest

      - name: Deploy to DigitalOcean App Platform
        run: |
          APP_NAME="spring-boot-demo"
          TAG=$(echo $GITHUB_SHA | head -c7)

          # Update the tag in app.yaml to use the specific SHA
          sed -i "s/tag: latest/tag: $TAG/" .do/app.yaml

          # Check if app exists
          APP_ID=$(doctl apps list --format ID --no-header --filter Name=$APP_NAME)
          
          if [ -z "$APP_ID" ]; then
            echo "Creating new app..."
            doctl apps create --spec .do/app.yaml
          else
            echo "Updating existing app $APP_ID..."
            doctl apps update $APP_ID --spec .do/app.yaml
          fi
